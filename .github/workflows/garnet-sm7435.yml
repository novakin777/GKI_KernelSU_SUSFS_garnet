name: Garnet SM7435 NetHunter

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/garnet-sm7435.yml"
      - ".github/config/garnet-nethunter.config"
      - ".github/garnet-module/**"
  workflow_dispatch:
    inputs:
      enable_kernelsu:
        description: "Integrate KernelSU-Next (dev)"
        type: boolean
        default: true
      enable_droidspaces:
        description: "Apply DroidSpaces 5.10 kABI patches"
        type: boolean
        default: true

env:
  KERNEL_REPOSITORY: https://github.com/LineageOS/android_kernel_xiaomi_sm7435.git
  KERNEL_COMMIT: 7ee66f07cebf9fdf16929e766f428435d5b951a7
  MODULES_REPOSITORY: https://github.com/LineageOS/android_kernel_xiaomi_sm7435-modules.git
  MODULES_COMMIT: 0247408280f62b7feb62c30cbdc76a5e62eebd84
  KSU_COMMIT: 5e6f1453338783f77c3f40e780b2b227342ed78b
  DROIDSPACES_COMMIT: 9c6a1c056e6cdb096c8cfd037e3221fcdf39bf7d
  CLANG_REPOSITORY: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
  CLANG_COMMIT: d0e0a3882edb1acc193263ae98fce706e82aca38
  CLANG_DIRECTORY: clang-r574158
  KERNEL_LOCALVERSION: -gki-g7ee66f07cebf
  EXPECTED_RELEASE: 5.10.260-gki-g7ee66f07cebf

jobs:
  build:
    name: 5.10.260-android12 garnet
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v7

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: false
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* dotnet-sdk-*"
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/gradle"

      - name: Add swap for ThinLTO
        shell: bash
        run: |
          set -euo pipefail
          sudo fallocate -l 12G /mnt/kernel-build.swap
          sudo chmod 0600 /mnt/kernel-build.swap
          sudo mkswap /mnt/kernel-build.swap
          sudo swapon /mnt/kernel-build.swap
          free -h
          swapon --show

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex git kmod libelf-dev \
            libssl-dev pahole python3 rsync unzip xz-utils zip zstd

      - name: Checkout LineageOS SM7435 kernel
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel
          git clone --no-checkout "$KERNEL_REPOSITORY" kernel/common
          git -C kernel/common fetch --depth=1 origin "$KERNEL_COMMIT"
          git -C kernel/common checkout --detach "$KERNEL_COMMIT"
          test "$(git -C kernel/common rev-parse HEAD)" = "$KERNEL_COMMIT"
          test "$(sed -n 's/^SUBLEVEL = //p' kernel/common/Makefile)" = "260"

      - name: Checkout Qualcomm SM7435 external modules
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout "$MODULES_REPOSITORY" kernel/sm7435-modules
          git -C kernel/sm7435-modules fetch --depth=1 origin "$MODULES_COMMIT"
          git -C kernel/sm7435-modules checkout --detach "$MODULES_COMMIT"
          test "$(git -C kernel/sm7435-modules rev-parse HEAD)" = "$MODULES_COMMIT"

      - name: Checkout AOSP Clang 21
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain
          git -C toolchain init
          git -C toolchain remote add origin "$CLANG_REPOSITORY"
          git -C toolchain config extensions.partialClone origin
          git -C toolchain config remote.origin.promisor true
          git -C toolchain config remote.origin.partialclonefilter blob:none
          git -C toolchain sparse-checkout init --cone
          git -C toolchain sparse-checkout set "$CLANG_DIRECTORY"
          git -C toolchain fetch --depth=1 origin "$CLANG_COMMIT"
          git -C toolchain checkout --detach FETCH_HEAD
          "toolchain/$CLANG_DIRECTORY/bin/clang" --version

      - name: Integrate KernelSU-Next
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_kernelsu }}
        uses: ./.github/actions/root-setup
        with:
          flavor: next
          commit: ${{ env.KSU_COMMIT }}

      - name: Apply DroidSpaces patches
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_droidspaces }}
        uses: ./.github/actions/droidspaces
        with:
          version: android12-5.10
          android_version: android12
          kernel_version: "5.10"
          os_patch_level: lineage-23.2
          sublevel: "260"
          droidspaces_commit: ${{ env.DROIDSPACES_COMMIT }}

      - name: Merge garnet configuration
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_DIRECTORY/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_DIRECTORY/lib64:${LD_LIBRARY_PATH:-}"
          out="$GITHUB_WORKSPACE/out"
          mkdir -p "$out"

          KCONFIG_CONFIG="$out/.config" \
            kernel/common/scripts/kconfig/merge_config.sh -m -r -O "$out" \
              kernel/common/arch/arm64/configs/gki_defconfig \
              kernel/common/arch/arm64/configs/vendor/parrot_GKI.config \
              kernel/common/arch/arm64/configs/vendor/garnet_GKI.config \
              kernel/common/arch/arm64/configs/vendor/debugfs.config \
              .github/config/garnet-nethunter.config

          make -C kernel/common O="$out" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            LOCALVERSION="$KERNEL_LOCALVERSION" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

      - name: Verify effective configuration
        shell: bash
        run: |
          set -euo pipefail
          config=out/.config
          required=(
            CONFIG_SYSVIPC=y
            CONFIG_PID_NS=y
            CONFIG_IPC_NS=y
            CONFIG_USER_NS=y
            CONFIG_DEVTMPFS=y
            CONFIG_CFG80211=m
            CONFIG_MAC80211=m
            CONFIG_ATH_COMMON=m
            CONFIG_ATH9K_HW=m
            CONFIG_ATH9K_COMMON=m
            CONFIG_ATH9K_HTC=m
          )
          for symbol in "${required[@]}"; do
            grep -Fqx "$symbol" "$config" || {
              echo "Missing required config: $symbol" >&2
              exit 1
            }
          done

      - name: Build Image, in-tree modules and AR9271 modules
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_DIRECTORY/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_DIRECTORY/lib64:${LD_LIBRARY_PATH:-}"
          export KBUILD_BUILD_USER=PixelOS-CI
          export KBUILD_BUILD_HOST=PixelOS-CI

          make -C kernel/common O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            LOCALVERSION="$KERNEL_LOCALVERSION" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            TARGET_PRODUCT=garnet \
            -j2 Image modules

          release="$(make -s -C kernel/common O="$GITHUB_WORKSPACE/out" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            LOCALVERSION="$KERNEL_LOCALVERSION" kernelrelease)"
          echo "Kernel release: $release"
          test "$release" = "$EXPECTED_RELEASE"

      - name: Build Qualcomm SM7435 external modules
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_DIRECTORY/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_DIRECTORY/lib64:${LD_LIBRARY_PATH:-}"
          export KBUILD_BUILD_USER=PixelOS-CI
          export KBUILD_BUILD_HOST=PixelOS-CI

          kernel_src="$GITHUB_WORKSPACE/kernel/common"
          module_root="$GITHUB_WORKSPACE/kernel/sm7435-modules"
          kernel_out="$GITHUB_WORKSPACE/out"
          install_root="$GITHUB_WORKSPACE/qcom-modules-install"
          module_relative_root=../sm7435-modules
          external_modules=(
            qcom/opensource/mmrm-driver
            qcom/opensource/audio-kernel
            qcom/opensource/camera-kernel
            qcom/opensource/cvp-kernel
            qcom/opensource/dataipa/drivers/platform/msm
            qcom/opensource/datarmnet/core
            qcom/opensource/datarmnet-ext/aps
            qcom/opensource/datarmnet-ext/offload
            qcom/opensource/datarmnet-ext/shs
            qcom/opensource/datarmnet-ext/perf
            qcom/opensource/datarmnet-ext/perf_tether
            qcom/opensource/datarmnet-ext/sch
            qcom/opensource/datarmnet-ext/wlan
            qcom/opensource/display-drivers/msm
            qcom/opensource/eva-kernel
            qcom/opensource/video-driver
            qcom/opensource/wlan/qcacld-3.0/.adrastea
          )

          common_args=(
            KERNEL_SRC="$kernel_src"
            OUT_DIR="$kernel_out"
            O="$kernel_out"
            ARCH=arm64
            LLVM=1
            LLVM_IAS=1
            LOCALVERSION="$KERNEL_LOCALVERSION"
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
            TARGET_PRODUCT=garnet
          )

          for module in "${external_modules[@]}"; do
            echo "Building external module: $module"
            make -C "$module_root/$module" \
              M="$module_relative_root/$module" \
              "${common_args[@]}" -j2
            make -C "$module_root/$module" \
              M="$module_relative_root/$module" \
              "${common_args[@]}" \
              INSTALL_MOD_PATH="$install_root" \
              INSTALL_MOD_STRIP=1 \
              KERNEL_UAPI_HEADERS_DIR="$kernel_out" \
              modules_install
          done

          release="$(cat out/include/config/kernel.release)"
          module_count="$(find "$install_root/lib/modules/$release" -type f -name '*.ko' | wc -l)"
          echo "Built Qualcomm modules: $module_count"
          test "$module_count" -gt 0
          depmod -b "$install_root" -F out/System.map "$release"

      - name: Package AnyKernel3 and AR9271 module
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --branch gki-2.0 \
            https://github.com/WildKernels/AnyKernel3.git AnyKernel3
          cp out/arch/arm64/boot/Image AnyKernel3/Image

          mkdir -p artifacts module-package/modules module-package/firmware/ath9k_htc
          cp .github/garnet-module/module.prop module-package/module.prop
          cp .github/garnet-module/service.sh module-package/service.sh
          cp .github/garnet-module/load.sh module-package/load.sh
          chmod 0755 module-package/service.sh module-package/load.sh

          for module in mac80211.ko ath.ko ath9k_hw.ko ath9k_common.ko ath9k_htc.ko; do
            path="$(find out -type f -name "$module" -print -quit)"
            if [ -z "$path" ]; then
              echo "Built module not found: $module" >&2
              exit 1
            fi
            cp "$path" "module-package/modules/$module"
            echo "$module: $(modinfo -F vermagic "$path")"
          done

          curl --fail --location --retry 5 \
            https://gitlab.com/kernel-firmware/linux-firmware/-/raw/main/ath9k_htc/htc_9271-1.4.0.fw \
            --output module-package/firmware/ath9k_htc/htc_9271-1.4.0.fw
          cp module-package/firmware/ath9k_htc/htc_9271-1.4.0.fw \
            module-package/firmware/htc_9271.fw

          printf '%s\n' \
            mac80211.ko \
            ath.ko \
            ath9k_hw.ko \
            ath9k_common.ko \
            ath9k_htc.ko > module-package/modules.load

          git -C AnyKernel3 rev-parse HEAD > artifacts/anykernel3.commit
          git -C kernel/common rev-parse HEAD > artifacts/kernel.commit
          git -C kernel/sm7435-modules rev-parse HEAD > artifacts/modules-tree.commit

          (cd AnyKernel3 && zip -q -r ../artifacts/garnet-5.10.260-nethunter-AnyKernel3.zip . -x '.git/*')
          (cd module-package && zip -q -r ../artifacts/garnet-ar9271-kernelsu-module.zip .)
          (cd qcom-modules-install && zip -q -r ../artifacts/garnet-qcom-sm7435-modules.zip .)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: garnet-sm7435-5.10.260
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
