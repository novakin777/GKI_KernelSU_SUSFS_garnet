name: Garnet SM7435 monitor injection V3

permissions:
  contents: read

on:
  push:
    branches: [garnet-monitor-injection-v3]
    paths:
      - ".github/workflows/garnet-sm7435.yml"
      - ".github/scripts/patch_qcacld_monitor_injection.py"
      - ".github/config/garnet-nethunter.config"
      - ".github/config/garnet-pixelos-stock.config.gz"
      - ".github/actions/droidspaces/**"
  workflow_dispatch:
    inputs:
      enable_droidspaces:
        description: "Apply DroidSpaces 5.10 kABI patches"
        type: boolean
        default: true

env:
  KERNEL_REPOSITORY: https://github.com/LineageOS/android_kernel_xiaomi_sm7435.git
  KERNEL_COMMIT: 7ee66f07cebf9fdf16929e766f428435d5b951a7
  MODULES_REPOSITORY: https://github.com/LineageOS/android_kernel_xiaomi_sm7435-modules.git
  MODULES_COMMIT: 0247408280f62b7feb62c30cbdc76a5e62eebd84
  DROIDSPACES_COMMIT: 9c6a1c056e6cdb096c8cfd037e3221fcdf39bf7d
  KERNELSU_REPOSITORY: https://github.com/KernelSU-Next/KernelSU-Next.git
  KERNELSU_COMMIT: 3b18216f71df189ab3d1b1ce0bdb21be1268e771
  KERNELSU_VERSION: v3.3.0
  CLANG_REPOSITORY: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86
  CLANG_COMMIT: f8439f0628d799092dd07df440a6334cab28939c
  CLANG_DIRECTORY: clang-r563880c
  KERNEL_LOCALVERSION: -gki-g7ee66f07cebf
  EXPECTED_RELEASE: 5.10.260-gki-g7ee66f07cebf

jobs:
  build:
    name: Matched stack + qcacld raw monitor TX + queue only
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout injection branch
        uses: actions/checkout@v7

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: false
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* mysql* dotnet-sdk-*"
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/gradle"

      - name: Add swap for full LTO
        shell: bash
        run: |
          set -euo pipefail
          sudo fallocate -l 12G /mnt/kernel-build.swap
          sudo chmod 0600 /mnt/kernel-build.swap
          sudo mkswap /mnt/kernel-build.swap
          sudo swapon /mnt/kernel-build.swap

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache curl flex git kmod libelf-dev \
            libssl-dev pahole python3 rsync unzip xz-utils zip zstd

      - name: Checkout exact PixelOS kernel and SM7435 modules
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kernel

          git clone --no-checkout "$KERNEL_REPOSITORY" kernel/common
          git -C kernel/common fetch --depth=1 origin "$KERNEL_COMMIT"
          git -C kernel/common checkout --detach "$KERNEL_COMMIT"
          test "$(git -C kernel/common rev-parse HEAD)" = "$KERNEL_COMMIT"

          git clone --no-checkout "$MODULES_REPOSITORY" kernel/sm7435-modules
          git -C kernel/sm7435-modules fetch --depth=1 origin "$MODULES_COMMIT"
          git -C kernel/sm7435-modules checkout --detach "$MODULES_COMMIT"
          test "$(git -C kernel/sm7435-modules rev-parse HEAD)" = "$MODULES_COMMIT"

      - name: Patch Adrastea monitor TX path
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_qcacld_monitor_injection.py kernel/sm7435-modules

          hdd=kernel/sm7435-modules/qcom/opensource/wlan/qcacld-3.0/core/hdd
          grep -n "ndo_start_xmit = hdd_mon_hard_start_xmit" "$hdd/src/wlan_hdd_main.c"
          grep -n "Enabling monitor Tx queues without carrier" "$hdd/src/wlan_hdd_main.c"
          grep -n "WLAN_START_ALL_NETIF_QUEUE" "$hdd/src/wlan_hdd_main.c"
          grep -n "hdd_mon_hard_start_xmit" "$hdd/src/wlan_hdd_tx_rx.c" "$hdd/inc/wlan_hdd_tx_rx.h"
          grep -n "OL_TX_SPEC_RAW.*OL_TX_SPEC_NO_AGGR.*OL_TX_SPEC_NO_ENCRYPT" "$hdd/src/wlan_hdd_tx_rx.c"
          git -C kernel/sm7435-modules diff --check
          git -C kernel/sm7435-modules diff -- \
            qcom/opensource/wlan/qcacld-3.0/core/hdd/inc/wlan_hdd_tx_rx.h \
            qcom/opensource/wlan/qcacld-3.0/core/hdd/src/wlan_hdd_main.c \
            qcom/opensource/wlan/qcacld-3.0/core/hdd/src/wlan_hdd_tx_rx.c

      - name: Integrate pinned KernelSU Next
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout "$KERNELSU_REPOSITORY" kernel/KernelSU-Next
          git -C kernel/KernelSU-Next fetch --depth=1 origin "$KERNELSU_COMMIT"
          git -C kernel/KernelSU-Next checkout --detach "$KERNELSU_COMMIT"
          test "$(git -C kernel/KernelSU-Next rev-parse HEAD)" = "$KERNELSU_COMMIT"

          ln -s ../../KernelSU-Next/kernel kernel/common/drivers/kernelsu
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> kernel/common/drivers/Makefile
          printf '\nsource "drivers/kernelsu/Kconfig"\n' >> kernel/common/drivers/Kconfig
          test -f kernel/common/drivers/kernelsu/Kconfig

      - name: Checkout matching AOSP Clang 21
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain
          git -C toolchain init
          git -C toolchain remote add origin "$CLANG_REPOSITORY"
          git -C toolchain config extensions.partialClone origin
          git -C toolchain config remote.origin.promisor true
          git -C toolchain config remote.origin.partialclonefilter blob:none
          git -C toolchain sparse-checkout init --cone
          git -C toolchain sparse-checkout set "$CLANG_DIRECTORY"
          git -C toolchain fetch --depth=1 origin "$CLANG_COMMIT"
          git -C toolchain checkout --detach FETCH_HEAD

          clang_version="$("toolchain/$CLANG_DIRECTORY/bin/clang" --version | head -n1)"
          echo "$clang_version"
          case "$clang_version" in
            *"Android (14054515"*"based on r563880c"*"clang version 21.0.0"*) ;;
            *) echo "Unexpected Clang build" >&2; exit 1 ;;
          esac

      - name: Apply DroidSpaces patches
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_droidspaces }}
        uses: ./.github/actions/droidspaces
        with:
          version: android12-5.10
          android_version: android12
          kernel_version: "5.10"
          os_patch_level: lineage-23.2
          sublevel: "260"
          droidspaces_commit: ${{ env.DROIDSPACES_COMMIT }}

      - name: Reproduce PixelOS configuration and add NetHunter support
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_DIRECTORY/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_DIRECTORY/lib64:${LD_LIBRARY_PATH:-}"
          out="$GITHUB_WORKSPACE/kernel/out/common"
          mkdir -p "$out"
          gzip -dc .github/config/garnet-pixelos-stock.config.gz > "$out/.config"
          echo "7acaf288b34d94fc16ba640c1ecef316ee8f98b1808476ab0b78a0f6ae7c6bfb  $out/.config" \
            | sha256sum --check --strict

          KCONFIG_CONFIG="$out/.config" \
            kernel/common/scripts/kconfig/merge_config.sh -m -r -O "$out" \
              "$out/.config" \
              .github/config/garnet-nethunter.config

          make -C kernel/common O="$out" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            LOCALVERSION="$KERNEL_LOCALVERSION" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            olddefconfig

          required=(
            CONFIG_CFG80211=m CONFIG_MAC80211=m
            CONFIG_ATH_COMMON=m CONFIG_ATH9K_HW=m CONFIG_ATH9K_COMMON=m
            CONFIG_ATH9K_HTC=m CONFIG_MODVERSIONS=y CONFIG_CFI_CLANG=y
            CONFIG_LTO_CLANG_FULL=y CONFIG_KPROBES=y CONFIG_KSU=y
          )
          for symbol in "${required[@]}"; do
            grep -Fqx "$symbol" "$out/.config" || {
              echo "Missing required config: $symbol" >&2
              exit 1
            }
          done

      - name: Build matched Image and in-tree modules
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_DIRECTORY/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_DIRECTORY/lib64:${LD_LIBRARY_PATH:-}"
          export KBUILD_BUILD_USER=PixelOS-CI
          export KBUILD_BUILD_HOST=PixelOS-CI
          out="$GITHUB_WORKSPACE/kernel/out/common"

          make -C kernel/common O="$out" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            LOCALVERSION="$KERNEL_LOCALVERSION" \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            TARGET_PRODUCT=garnet BOARD_PLATFORM=parrot \
            -j2 Image modules

          release="$(make -s -C kernel/common O="$out" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            LOCALVERSION="$KERNEL_LOCALVERSION" kernelrelease)"
          echo "Kernel release: $release"
          test "$release" = "$EXPECTED_RELEASE"
          test -s "$out/drivers/kernelsu/built-in.a"

          make -C kernel/common O="$out" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            LOCALVERSION="$KERNEL_LOCALVERSION" \
            INSTALL_MOD_PATH="$GITHUB_WORKSPACE/module-stage" \
            INSTALL_MOD_STRIP=1 modules_install

      - name: Build every matched SM7435 external module tree
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_DIRECTORY/bin:$PATH"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/toolchain/$CLANG_DIRECTORY/lib64:${LD_LIBRARY_PATH:-}"
          export KBUILD_BUILD_USER=PixelOS-CI
          export KBUILD_BUILD_HOST=PixelOS-CI
          kernel_src="$GITHUB_WORKSPACE/kernel/common"
          ext_root="$GITHUB_WORKSPACE/kernel/sm7435-modules"
          out="$GITHUB_WORKSPACE/kernel/out/common"
          relative_root=../sm7435-modules
          external_modules=(
            qcom/opensource/mmrm-driver
            qcom/opensource/audio-kernel
            qcom/opensource/camera-kernel
            qcom/opensource/cvp-kernel
            qcom/opensource/dataipa/drivers/platform/msm
            qcom/opensource/datarmnet/core
            qcom/opensource/datarmnet-ext/aps
            qcom/opensource/datarmnet-ext/offload
            qcom/opensource/datarmnet-ext/shs
            qcom/opensource/datarmnet-ext/perf
            qcom/opensource/datarmnet-ext/perf_tether
            qcom/opensource/datarmnet-ext/sch
            qcom/opensource/datarmnet-ext/wlan
            qcom/opensource/display-drivers/msm
            qcom/opensource/eva-kernel
            qcom/opensource/video-driver
            qcom/opensource/wlan/qcacld-3.0/.adrastea
          )

          for module in "${external_modules[@]}"; do
            echo "::group::Build $module"
            flags=(
              "M=$relative_root/$module"
              "KERNEL_SRC=$kernel_src" "OUT_DIR=$out" "O=$out"
              ARCH=arm64 LLVM=1 LLVM_IAS=1
              "LOCALVERSION=$KERNEL_LOCALVERSION"
              CROSS_COMPILE=aarch64-linux-gnu-
              CROSS_COMPILE_ARM32=arm-linux-gnueabi-
              TARGET_PRODUCT=garnet BOARD_PLATFORM=parrot
            )
            make -C "$ext_root/$module" "${flags[@]}" -j2
            make -C "$ext_root/$module" "${flags[@]}" \
              "INSTALL_MOD_PATH=$GITHUB_WORKSPACE/module-stage" \
              INSTALL_MOD_STRIP=1 "KERNEL_UAPI_HEADERS_DIR=$out" modules_install
            echo "::endgroup::"
          done

      - name: Verify monitor TX is present in qca_cld3_adrastea
        shell: bash
        run: |
          set -euo pipefail

          # modules_install already proved where Kbuild placed the finished
          # module. Validate that deterministic staged copy instead of guessing
          # the location of Kbuild's O= output for the .adrastea symlink tree.
          module="$(find "module-stage/lib/modules/$EXPECTED_RELEASE" \
            -type f -name 'qca_cld3_adrastea.ko' -print -quit)"
          test -n "$module"
          test -s "$module"
          echo "Staged module: $module"

          readelf -h "$module" | grep -F 'AArch64'
          modinfo "$module" \
            | grep -F "vermagic:       $EXPECTED_RELEASE SMP preempt mod_unload modversions aarch64"

          # Full LTO and INSTALL_MOD_STRIP may inline, internalize, or remove
          # local names. Source-level grep in the patch step is authoritative.
          echo "ELF symbol diagnostics (absence is expected and is not a failure):"
          readelf -Ws "$module" \
            | grep -E 'hdd_mon_hard_start_xmit|ol_txrx_get_mon_vdev_from_pdev|cdp_tx_non_std' \
            || true

      - name: Package injection test artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/monitor-injection-v3/modules
          cp kernel/out/common/arch/arm64/boot/Image artifacts/monitor-injection-v3/Image
          cp kernel/out/common/.config artifacts/monitor-injection-v3/kernel.config
          cp kernel/out/common/Module.symvers artifacts/monitor-injection-v3/Module.symvers

          qca="$(find "module-stage/lib/modules/$EXPECTED_RELEASE" -type f -name 'qca_cld3_adrastea.ko' -print -quit)"
          cp "$qca" artifacts/monitor-injection-v3/modules/qca_cld3_adrastea.ko
          cp .github/scripts/patch_qcacld_monitor_injection.py artifacts/monitor-injection-v3/

          git -C kernel/common rev-parse HEAD > artifacts/monitor-injection-v3/kernel.commit
          git -C kernel/sm7435-modules rev-parse HEAD > artifacts/monitor-injection-v3/modules.commit
          git -C kernel/KernelSU-Next rev-parse HEAD > artifacts/monitor-injection-v3/kernelsu-next.commit
          printf '%s\n' "$KERNELSU_VERSION" > artifacts/monitor-injection-v3/kernelsu-next.version
          printf '%s\n' \
            'monitor open -> START_ALL_NETIF_QUEUE_N_CARRIER -> ndo_start_xmit -> strip radiotap -> monitor vdev -> cdp_tx_non_std RAW|NO_AGGR|NO_ENCRYPT' \
            > artifacts/monitor-injection-v3/README.txt

          sha256sum \
            artifacts/monitor-injection-v3/Image \
            artifacts/monitor-injection-v3/modules/qca_cld3_adrastea.ko \
            > artifacts/monitor-injection-v3/SHA256SUMS

      - name: Upload monitor injection V3
        uses: actions/upload-artifact@v6
        with:
          name: garnet-monitor-injection-v3-${{ github.run_number }}
          path: artifacts/monitor-injection-v3
          if-no-files-found: error
          compression-level: 9
